# Routed network, 4 routers, 4 LANs, ring topology,
# two summary routes.

student_id_last4: "0050"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.50.1.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.50.2.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.50.32.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.50.33.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.50.12.0/30]
  - [r2, r3, 10.50.23.0/30]
  - [r3, r4, 10.50.34.0/30]
  - [r4, r1, 10.50.41.0/30]

routes:
  r1:
    - to: 10.50.2.0/24
      via: 10.50.12.2
    - to: 10.50.32.0/20
      via: 10.50.12.2
  r2:
    - to: 10.50.1.0/24
      via: 10.50.12.1
    - to: 10.50.32.0/20
      via: 10.50.12.1
  r3:
    - to: 10.50.0.0/22
      via: 10.50.23.1
    - to: 10.50.33.0/24
      via: 10.50.34.2
  r4:
    - to: 10.50.0.0/22
      via: 10.50.41.2
    - to: 10.50.32.0/24
      via: 10.50.34.1
